[app]
name = "kept"
version = "1.14.7-bottle.1"
description = "Home inventory with its own PostgreSQL database"

[runtime.container]
image = "Dockerfile.bottle"
port = 8080

[routing]
health_check = "/readyz"
public_paths = []

[resources]
memory_mb = 1024
build_memory_mb = 4096
cpu_cores = 1.0

[data]
app_data = true
